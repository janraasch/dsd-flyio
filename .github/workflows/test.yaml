# Note: For now we run the tests from within core.
# A proper CI setup for this plugin is tracked in this issue:
# https://github.com/django-simple-deploy/dsd-flyio/issues/10

name: dsd-flyio CI tests

on:
  pull_request:

  push:
    branches:
      main

jobs:
  test:
    name: Run tests on ${{ matrix.os }} with Python ${{ matrix.python-version}}
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12"] #["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: 'dsd-flyio'
      
      - name: Checkout django-simple-deploy
        uses: actions/checkout@v4
        with:
          repository: django-simple-deploy/django-simple-deploy
          path: django-simple-deploy

      - name: Install uv and set the Python version
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          cd django-simple-deploy/
          uv venv
          uv pip install -e ".[dev]"
          uv pip install -e "../dsd-flyio[dev]"
      - name: Configure Git
        run: |
          git config --global user.email "ci_tester@example.com"
          git config --global user.name "Ci Tester"
          git config --global init.defaultBranch main
      - name: Run integration tests
        run: |
          cd django-simple-deploy/
          uv run pytest
